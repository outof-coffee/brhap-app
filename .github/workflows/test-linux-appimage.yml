name: Test Linux AppImage

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options:
          - x86_64
          - arm64
        default: x86_64

jobs:
  build-appimage:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      TRIPLE: ${{ inputs.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TRIPLE }}

      - uses: Swatinem/rust-cache@v2

      # Same package list release-linux-from-macos.sh's Dockerfile installs
      # for the equivalent macOS-hosted container build. libfuse2 is not
      # listed - GitHub's Ubuntu runners already ship it.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            libwayland-client0 \
            libwayland-egl1 \
            libxkbcommon0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libvulkan1

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build brhap-app
        run: cargo build --release -p brhap-app --target "$TRIPLE"

      # gitignored and regenerated from cargo metadata each run, same as
      # release-linux-from-macos.sh does locally - never hand-write or
      # commit this file. out-dir is the plain build output dir - there's
      # no bind mount here to work around, unlike the macOS-hosted
      # container flow.
      - name: Generate packager-linux.toml
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "brhap-app") | .version')
          cat > packager-linux.toml <<EOF
          # auto-generated - do not commit or edit!
          name = "brhap-app"
          product-name = "brhap"
          version = "$VERSION"
          identifier = "coffee.outof.brhap"
          icons = ["brhap-app/assets/icon.png"]
          out-dir = "target/$TRIPLE/release"

          [[binaries]]
          path = "brhap-app"
          main = true

          [linux]
          generate-desktop-entry = true

          [appimage]
          libs = [
            "libwayland-client.so.0",
            "libwayland-egl.so.1",
            "libxkbcommon.so.0",
            "libX11.so.6",
            "libX11-xcb.so.1",
            "libxcb.so.1",
          ]
          EOF

      - name: Package AppImage
        run: cargo packager -f appimage -c packager-linux.toml

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: brhap-app-${{ inputs.arch }}-AppImage
          path: target/${{ env.TRIPLE }}/release/*.AppImage
