name: Release Linux AppImage

# Builds arm64 and x86_64 AppImages when a version tag is pushed, and
# uploads them as workflow artifacts. Does not create a GitHub Release -
# that stays a manual step.
on:
  push:
    tags:
      - 'v*'
  # Lets a specific tag (or any other ref) be picked from the Actions UI's
  # "Use workflow from" dropdown, without needing a new tag push.
  workflow_dispatch:

jobs:
  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - arch: x86_64
            runs-on: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runs-on }}
    env:
      TRIPLE: ${{ matrix.triple }}
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # Same package list release-linux-from-macos.sh's Dockerfile installs
      # for the equivalent macOS-hosted container build. libfuse2 is not
      # listed - GitHub's Ubuntu runners already ship it.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            cmake \
            libwayland-client0 \
            libwayland-egl1 \
            libxkbcommon0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libvulkan1

      - name: Cache cargo-packager binary
        id: cache-cargo-packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-0.11.8-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.cache-cargo-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build brhap-app
        run: cargo build --release -p brhap-app --target "$TRIPLE"

      # gitignored and regenerated from cargo metadata each run, same as
      # release-linux-from-macos.sh does locally - never hand-write or
      # commit this file.
      - name: Generate packager-linux.toml
        run: |
          VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "brhap-app") | .version')
          cat > packager-linux.toml <<EOF
          # auto-generated - do not commit or edit!
          name = "brhap-app"
          product-name = "brhap"
          version = "$VERSION"
          identifier = "coffee.outof.brhap"
          icons = ["brhap-app/assets/icon.png"]
          out-dir = "target/$TRIPLE/release"

          [[binaries]]
          path = "brhap-app"
          main = true

          [linux]
          generate-desktop-entry = true

          [appimage]
          libs = [
            "libwayland-client.so.0",
            "libwayland-egl.so.1",
            "libxkbcommon.so.0",
            "libX11.so.6",
            "libX11-xcb.so.1",
            "libxcb.so.1",
          ]
          EOF

      - name: Package AppImage
        run: cargo packager -f appimage -c packager-linux.toml

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: brhap-app-${{ matrix.arch }}-AppImage
          path: target/${{ matrix.triple }}/release/*.AppImage
